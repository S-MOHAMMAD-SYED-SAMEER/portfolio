<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Case study — extracts structured data from invoices and purchase orders, validates it deterministically outside the model, and routes uncertain fields to a human review queue."
    />
    <title>DocIntel — Case Study</title>
    <script>
      // Sets the theme before first paint so no page flashes the wrong one.
      // Dark is the default; only a stored choice overrides it. Deliberately
      // does not read prefers-color-scheme.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/case-study-docintel.tsx"></script>
  </body>
</html>
